<details class="ledger-units" data-all="{{ ui.all_properties }}" data-multiple="{{ ui.account_multiple }}">
<summary id="{{ field.id_for_label }}">{{ ui.all_properties }}</summary>
<div class="ledger-units-panel"><input type="search" placeholder="{{ ui.unit_search }}" aria-label="{{ ui.unit_search }}">{{ field }}</div>
</details>
{{ form.unit_properties|json_script:"ledger-unit-properties" }}
{{ form.unit_labels|json_script:"ledger-unit-labels" }}
<style>
.ledger-units{position:relative}.ledger-units>summary{list-style:none;cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;min-height:42px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ledger-units>summary::after{content:'⌄';float:right}.ledger-units>summary::-webkit-details-marker{display:none}.ledger-units-panel{position:absolute;top:100%;left:0;z-index:90;width:max(100%,240px);max-width:75vw;padding:12px;background:#fff;border:1px solid #cbd5e1;border-radius:7px;box-shadow:0 8px 22px #0002;max-height:330px;overflow:auto;box-sizing:border-box}.ledger-units-panel label{padding:8px 0;margin:0;font-size:.85rem;font-weight:400;color:#334155}.ledger-units-panel input[type=checkbox]{width:17px;min-height:0;margin-right:7px}.ledger-units-panel input[type=search]{margin-bottom:10px}.ledger-units [hidden]{display:none!important}
</style>
<script>(()=>{const picker=document.querySelector('.ledger-units');if(!picker)return;
const scope=document.querySelector('[name=scope]'),summary=picker.querySelector('summary'),search=picker.querySelector('[type=search]'),boxes=[...picker.querySelectorAll('[name=unit]')],all=boxes.find(box=>box.value==='all'),properties=JSON.parse(document.getElementById('ledger-unit-properties').textContent);
const shortLabels=JSON.parse(document.getElementById('ledger-unit-labels').textContent),fullLabels=new Map(boxes.map(box=>[box.value,box.closest('label').textContent.trim()]));
function labelText(box,text){const label=box.closest('label');[...label.childNodes].filter(node=>node.nodeType===3).forEach(node=>node.remove());let span=label.querySelector('.unit-choice-text');if(!span){span=document.createElement('span');span.className='unit-choice-text';label.append(span);}span.textContent=' '+text;}
function available(box){const specific=scope.value.startsWith('property:');if(box.value==='all'||box.value==='property_level')return true;if(box.value==='all_units')return !specific;return specific&&String(properties[box.value])===scope.value.slice(9);}
function children(){return boxes.filter(box=>box!==all&&!box.disabled);}
function update(){const options=children();if(all.checked)options.forEach(box=>box.checked=true);if(!options.some(box=>box.checked)){all.checked=true;options.forEach(box=>box.checked=true);}const selected=options.filter(box=>box.checked);all.checked=selected.length===options.length;all.indeterminate=selected.length>0&&!all.checked;summary.textContent=all.checked?picker.dataset.all+' ('+options.length+')':selected.length===1?selected[0].closest('label').textContent.trim()+' (1)':picker.dataset.multiple+' ('+selected.length+')';summary.title=summary.textContent;labelText(all,picker.dataset.all+' ('+options.length+')');boxes.forEach(box=>{box.closest('label').parentElement.hidden=box.disabled||(box!==all&&!box.closest('label').textContent.toLowerCase().includes(search.value.toLowerCase()));});}
function changeProperty(reset){boxes.forEach(box=>{if(properties[box.value])labelText(box,shortLabels[box.value]);box.disabled=!available(box);if(box.disabled||reset)box.checked=false;});if(reset)all.checked=true;update();}
picker.addEventListener('change',event=>{if(event.target.name!=='unit')return;if(event.target===all){children().forEach(box=>box.checked=all.checked);}else all.checked=false;update();});search.addEventListener('input',update);scope.addEventListener('change',()=>{search.value='';changeProperty(true);});document.addEventListener('click',event=>{if(!picker.contains(event.target))picker.open=false;});picker.addEventListener('keydown',event=>{if(event.key==='Escape'){picker.open=false;summary.focus();}});picker.addEventListener('toggle',()=>summary.setAttribute('aria-expanded',String(picker.open)));changeProperty(false);
})();</script>
