<fieldset class="fema-picker">
  <legend>FEMA Flood Plain <span aria-label="required" style="color:#b91c1c">*</span> <button type="button" class="school-help-button btn-primary" aria-label="Information about FEMA Flood Plain" data-school-help="help-fema-types">i</button></legend>
  <dialog class="school-help-dialog" id="help-fema-types" aria-labelledby="help-title-fema-types">
    <div class="school-help-header btn-primary"><h3 id="help-title-fema-types">FEMA Flood Plain</h3><button type="button" data-school-help-close aria-label="Close help">×</button></div>
    <div class="school-help-body"><p>{{ field.field_help }}</p></div>
  </dialog>
  <details class="fema-dropdown" {% if profile_form.fema_flood_plain_types.errors %}open{% endif %}>
    <summary><span data-fema-summary>Select One</span></summary>
    <div class="fema-panel">
      <label for="fema-search">Search FEMA Flood Plain</label>
      <input type="search" id="fema-search" placeholder="Type to filter options" autocomplete="off">
      <div class="fema-options">
        {% for option in profile_form.fema_flood_plain_types %}
        <div data-fema-option>{{ option }}</div>
        {% endfor %}
      </div>
      <p data-fema-empty hidden>No matching flood plain options.</p>
    </div>
  </details>
  {{ profile_form.fema_flood_plain_types.errors }}
  <p class="fema-selection" data-fema-selected aria-live="polite"></p>
</fieldset>
<style>
.fema-picker {border:0;min-width:0;}
.fema-picker legend {font-size:.9rem;font-weight:600;color:#334155;margin-bottom:7px;}
.fema-help {color:#64748b;font-size:.85rem;line-height:1.5;margin:6px 0 10px;}
.fema-dropdown {border:1px solid #cbd5e1;border-radius:7px;background:white;margin-bottom:10px;}
.fema-dropdown summary {padding:10px 12px;cursor:pointer;overflow-wrap:anywhere;}
.fema-dropdown summary:focus-visible {outline:2px solid #2563eb;outline-offset:2px;}
.fema-panel {padding:12px;border-top:1px solid #e2e8f0;}
.fema-options {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:240px;overflow-y:auto;margin-top:12px;}
.fema-options label {display:flex;align-items:center;gap:8px;padding:7px;margin:0;font-weight:400;cursor:pointer;}
.fema-options label:hover {background:#f1f5f9;}
.fema-options input[type=checkbox] {width:18px;height:18px;flex:none;}
.fema-selection {font-size:.85rem;color:#334155;margin:8px 0 14px;overflow-wrap:anywhere;}
@media(max-width:450px){.fema-options{grid-template-columns:1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const picker = document.querySelector('.fema-picker');
  const entries = Array.from(picker.querySelectorAll('[data-fema-option]'));
  const dropdown = picker.querySelector('details');
  function updateSelection() {
    const names = entries.filter(entry => entry.querySelector('input').checked)
      .map(entry => entry.textContent.trim());
    picker.querySelector('[data-fema-summary]').textContent = names.length ? names.join(', ') : 'Select One';
    picker.querySelector('[data-fema-selected]').textContent = names.length ? 'Selected: ' + names.join(', ') : 'No flood plain options selected.';
  }
  entries.forEach(entry => entry.querySelector('input').addEventListener('change', updateSelection));
  picker.querySelector('#fema-search').addEventListener('input', function () {
    const query = this.value.trim().toLocaleLowerCase();
    entries.forEach(entry => {entry.hidden = !entry.textContent.toLocaleLowerCase().includes(query);});
    picker.querySelector('[data-fema-empty]').hidden = entries.some(entry => !entry.hidden);
  });
  picker.addEventListener('keydown', event => {
    if (event.key === 'Escape' && dropdown.open) {
      dropdown.open = false;
      dropdown.querySelector('summary').focus();
    }
    if (event.key === 'Enter' && event.target.type === 'search') event.preventDefault();
  });
  updateSelection();
});
</script>
