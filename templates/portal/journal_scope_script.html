<script>(()=>{const scope=document.querySelector('[name="scope"]'),property=document.querySelector('[name="property"]'),unit=document.querySelector('select[name="unit"]');if(!unit||(!scope&&!property))return;function update(){const propertyId=scope?(scope.value.startsWith('property:')?scope.value.slice(9):''):property.value;unit.disabled=!propertyId;[...unit.options].forEach(option=>{if(!option.value)return;option.hidden=option.dataset.property!==propertyId;});if(unit.selectedOptions[0]?.hidden||unit.disabled)unit.value='';}scope?.addEventListener('change',update);property?.addEventListener('change',update);update();})();</script>
