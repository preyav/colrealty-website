<div data-income-items><table><thead><tr><th>{{ widget.ui.account }}</th><th>{{ widget.ui.description }}</th><th>{{ widget.ui.amount }}</th><th></th></tr></thead><tbody>{% for item in widget.items %}<tr><td><select name="{{ widget.name }}_account" aria-label="{{ widget.ui.account }}"><option value="">{{ widget.ui.default }}</option>{% for account in widget.accounts %}<option value="{{ account.pk }}"{% if account.pk|stringformat:"s" == item.account_id|stringformat:"s" %} selected{% endif %}>{{ account }}</option>{% endfor %}</select></td><td><input name="{{ widget.name }}_description" value="{{ item.description }}" maxlength="200" aria-label="{{ widget.ui.description }}"></td><td><input type="number" step="0.01" min="0.01" name="{{ widget.name }}_amount" value="{{ item.amount }}" aria-label="{{ widget.ui.amount }}"></td><td><button type="button" data-remove-item>{{ widget.ui.remove }}</button></td></tr>{% endfor %}</tbody></table><button type="button" data-add-item>{{ widget.ui.add }}</button></div>
<script>(()=>{const box=document.currentScript.previousElementSibling;box.querySelector('[data-add-item]').addEventListener('click',()=>{const body=box.querySelector('tbody');if(body.rows.length>=50)return;const row=body.rows[0].cloneNode(true);row.querySelectorAll('input,select').forEach(input=>input.value='');body.appendChild(row);});box.addEventListener('click',event=>{if(!event.target.matches('[data-remove-item]'))return;const row=event.target.closest('tr');if(box.querySelector('tbody').rows.length>1)row.remove();else row.querySelectorAll('input,select').forEach(input=>input.value='');});})();</script>
