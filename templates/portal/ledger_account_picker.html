<details class="ledger-accounts" data-empty="{{ ui.account_select }}" data-multiple="{{ ui.account_multiple }}" data-all="{{ ui.account_all }}">
  <summary id="{{ field.id_for_label }}">{{ ui.account_select }}</summary>
  <div class="ledger-accounts-panel">
    <div class="ledger-account-groups"></div>
    <div class="ledger-account-options">
      <input type="search" class="ledger-account-search" placeholder="{{ ui.account_search }}" aria-label="{{ ui.account_search }}">
      <label class="ledger-account-all"><input type="checkbox"> <span>{{ ui.account_all }}</span></label>
      <div class="ledger-account-list">{{ field }}</div>
    </div>
  </div>
</details>
<style>
.ledger-accounts{position:relative}.ledger-accounts>summary{list-style:none;cursor:pointer;border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;min-height:42px;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ledger-accounts>summary::after{content:'⌄';float:right;margin-left:10px}.ledger-accounts>summary::-webkit-details-marker{display:none}.ledger-accounts-panel{position:absolute;top:100%;left:0;z-index:90;display:grid;grid-template-columns:minmax(120px,1fr) minmax(210px,2fr);width:min(600px,75vw);background:#fff;border:1px solid #cbd5e1;border-radius:7px;box-shadow:0 8px 22px #0002;overflow:hidden}.ledger-account-groups{border-right:1px solid #e2e8f0;padding:6px 0}.ledger-account-groups button{display:block;width:100%;border:0;text-align:left;background:#fff;padding:12px;font:inherit;cursor:pointer;color:inherit}.ledger-account-groups button[aria-pressed=true]{background:#e3f5fa;color:#087c96}.ledger-account-options{padding:12px;min-width:0}.ledger-account-options .ledger-account-search{margin-bottom:12px}.ledger-account-list{max-height:280px;overflow-y:auto}.ledger-account-options label{font-size:.85rem;font-weight:400;color:#334155;line-height:1.5;margin:0;padding:7px 0}.ledger-account-options input[type=checkbox]{width:17px;min-height:0;margin-right:7px}.ledger-account-all span{font-weight:600}.ledger-accounts [hidden]{display:none!important}@media(max-width:650px){.ledger-accounts-panel{width:min(500px,80vw);grid-template-columns:110px minmax(150px,1fr)}}
</style>
<script>(()=>{document.querySelectorAll('.ledger-accounts').forEach(picker=>{
const summary=picker.querySelector('summary'),list=picker.querySelector('.ledger-account-list'),boxes=[...list.querySelectorAll('input[type=checkbox]')],groups=picker.querySelector('.ledger-account-groups'),search=picker.querySelector('.ledger-account-search'),all=picker.querySelector('.ledger-account-all input'),allLabel=picker.querySelector('.ledger-account-all span');let type='';
function matches(box){return (!type||box.dataset.accountType===type)&&box.closest('label').textContent.toLowerCase().includes(search.value.trim().toLowerCase());}
function update(){const selected=boxes.filter(box=>box.checked);summary.textContent=selected.length===1?selected[0].dataset.accountName:selected.length>1?picker.dataset.multiple+' ('+selected.length+')':picker.dataset.empty;summary.title=summary.textContent;const visible=boxes.filter(matches),checked=visible.filter(box=>box.checked);all.checked=visible.length>0&&checked.length===visible.length;all.indeterminate=checked.length>0&&checked.length<visible.length;all.disabled=!visible.length;boxes.forEach(box=>{box.closest('label').parentElement.hidden=!matches(box);});}
const types=new Map();boxes.forEach(box=>types.set(box.dataset.accountType,box.dataset.typeLabel));
function group(key,label){const button=document.createElement('button');button.type='button';const count=boxes.filter(box=>!key||box.dataset.accountType===key).length;button.textContent=label+' ('+count+')';button.dataset.group=key;button.setAttribute('aria-pressed',String(key===type));button.addEventListener('click',()=>{type=key;groups.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));allLabel.textContent=label;update();});groups.append(button);}
group('',picker.dataset.all);types.forEach((label,key)=>group(key,label));search.addEventListener('input',update);list.addEventListener('change',update);all.addEventListener('change',()=>{boxes.filter(matches).forEach(box=>box.checked=all.checked);update();});document.addEventListener('click',event=>{if(!picker.contains(event.target))picker.open=false;});picker.addEventListener('keydown',event=>{if(event.key==='Escape'){picker.open=false;summary.focus();}});summary.setAttribute('aria-expanded',String(picker.open));picker.addEventListener('toggle',()=>summary.setAttribute('aria-expanded',String(picker.open)));update();
});})();</script>
