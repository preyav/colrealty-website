<nav class="accounting-sidebar" aria-label="{{ ui.accounting }}">{% for item in items %}{% if item.url %}<a href="{{ item.url }}" class="nav-subitem{% if active == item.key %} active{% endif %}">{{ item.label }}</a>{% else %}<span class="nav-subitem accounting-unavailable" aria-disabled="true" title="{{ ui.unavailable }}">{{ item.label }} <small>· {{ ui.planned }}</small></span>{% endif %}{% endfor %}</nav>
<style>
.accounting-popout>summary{list-style:none;cursor:pointer}.accounting-popout>summary::-webkit-details-marker{display:none}.accounting-popout .accounting-sidebar{position:fixed;left:0;top:0;visibility:hidden;z-index:1200;display:block;min-width:245px;max-width:min(310px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;background:white;border:1px solid #d7dee5;border-radius:7px;padding:8px 0;box-shadow:0 8px 26px #0003}.accounting-popout[open] .accounting-sidebar[data-positioned]{visibility:visible}.accounting-popout:not([open]) .accounting-sidebar{display:none}.accounting-popout .nav-subitem{display:block;padding:10px 18px;color:#334155;font-size:.83rem;white-space:normal}.accounting-popout .nav-subitem:hover{background:#eff8fb}.accounting-popout .nav-subitem.active{background:#e3f5fa;color:#087c96}.accounting-popout .accounting-unavailable{color:#94a3b8;cursor:default}.accounting-unavailable small{font-size:.65rem;color:#94a3b8}.accounting-popout:focus-within>summary{outline:2px solid #01AACE;outline-offset:-2px}
</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const menu=document.getElementById('accounting-popout');if(!menu)return;const popup=menu.querySelector('nav'),button=menu.querySelector('summary');function place(){popup.removeAttribute('data-positioned');const rect=button.getBoundingClientRect();const width=popup.offsetWidth;popup.style.left=Math.max(12,Math.min(rect.right+8,innerWidth-width-12))+'px';popup.style.top=Math.max(12,Math.min(rect.top,innerHeight-popup.offsetHeight-12))+'px';popup.setAttribute('data-positioned','');}menu.addEventListener('toggle',()=>{button.setAttribute('aria-expanded',String(menu.open));if(menu.open)place();else popup.removeAttribute('data-positioned');});button.setAttribute('aria-expanded','false');document.addEventListener('click',event=>{if(!menu.contains(event.target))menu.open=false;});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.open){menu.open=false;button.focus();}});window.addEventListener('resize',()=>{if(menu.open)place();});document.addEventListener('scroll',event=>{if(menu.open&&!menu.contains(event.target))menu.open=false;},true);});</script>
