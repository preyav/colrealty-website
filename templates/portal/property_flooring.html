<fieldset class="flooring-picker">
  <legend>Flooring</legend>
  <details class="flooring-dropdown" {% if profile_form.flooring_types.errors %}open{% endif %}>
    <summary><span data-flooring-summary>Select flooring types</span></summary>
    <div class="flooring-panel">
      <label for="flooring-search">Search flooring types</label>
      <input type="search" id="flooring-search" placeholder="Type to filter options" autocomplete="off">
      <div class="flooring-options">
        {% for option in profile_form.flooring_types %}
        <div data-flooring-option>{{ option }}</div>
        {% endfor %}
      </div>
      <p data-flooring-empty hidden>No matching flooring types.</p>
    </div>
  </details>
  {{ profile_form.flooring_types.errors }}
  <p class="flooring-selection" data-flooring-selected aria-live="polite"></p>
  <p data-flooring-none hidden role="status">None cannot be combined with another feature.</p>
  <div data-flooring-details>
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}{{ field.errors }}
  <p class="flooring-help">{{ field.help_text }}</p>
  </div>
</fieldset>
<style>
.flooring-picker [hidden] {display:none !important;}
.flooring-options [aria-disabled="true"] {opacity:.45;}
.flooring-options [aria-disabled="true"] label {cursor:not-allowed;}
.flooring-picker {border:0;min-width:0;}
.flooring-picker legend {font-size:.9rem;font-weight:600;color:#334155;margin-bottom:7px;}
.flooring-help {color:#64748b;font-size:.85rem;line-height:1.5;margin:6px 0 10px;}
.flooring-dropdown {border:1px solid #cbd5e1;border-radius:7px;background:white;margin-bottom:10px;}
.flooring-dropdown summary {padding:10px 12px;cursor:pointer;overflow-wrap:anywhere;}
.flooring-dropdown summary:focus-visible {outline:2px solid #2563eb;outline-offset:2px;}
.flooring-panel {padding:12px;border-top:1px solid #e2e8f0;}
.flooring-options {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:240px;overflow-y:auto;margin-top:12px;}
.flooring-options label {display:flex;align-items:center;gap:8px;padding:7px;margin:0;font-weight:400;cursor:pointer;}
.flooring-options label:hover {background:#f1f5f9;}
.flooring-options input[type=checkbox] {width:18px;height:18px;flex:none;}
.flooring-selection {font-size:.85rem;color:#334155;margin:8px 0 14px;overflow-wrap:anywhere;}
@media(max-width:450px){.flooring-options{grid-template-columns:1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const picker = document.querySelector('.flooring-picker');
  const entries = Array.from(picker.querySelectorAll('[data-flooring-option]'));
  const dropdown = picker.querySelector('details');
  function updateSelection() {
    const none = entries.find(entry => entry.querySelector('input').value === 'none');
    const noneSelected = !!none && none.querySelector('input').checked;
    entries.forEach(entry => {
      const input = entry.querySelector('input');
      input.disabled = noneSelected && input.value !== 'none';
      if (input.disabled) input.checked = false;
      entry.setAttribute('aria-disabled', String(input.disabled));
    });
    picker.querySelector('[data-flooring-none]').hidden = !noneSelected;
    const selected = entries.filter(entry => entry.querySelector('input').checked);
    picker.querySelector('[data-flooring-details]').hidden =
      !(selected.length === 1 && selected[0].querySelector('input').value === 'other');
    const names = entries.filter(entry => entry.querySelector('input').checked)
      .map(entry => entry.textContent.trim());
    picker.querySelector('[data-flooring-summary]').textContent = names.length ? names.join(', ') : 'Select flooring types';
    picker.querySelector('[data-flooring-selected]').textContent = names.length ? 'Selected: ' + names.join(', ') : 'No flooring types selected.';
  }
  entries.forEach(entry => entry.querySelector('input').addEventListener('change', updateSelection));
  picker.querySelector('#flooring-search').addEventListener('input', function () {
    const query = this.value.trim().toLocaleLowerCase();
    entries.forEach(entry => {entry.hidden = !entry.textContent.toLocaleLowerCase().includes(query);});
    picker.querySelector('[data-flooring-empty]').hidden = entries.some(entry => !entry.hidden);
  });
  picker.addEventListener('keydown', event => {
    if (event.key === 'Escape' && dropdown.open) {
      dropdown.open = false;
      dropdown.querySelector('summary').focus();
    }
    if (event.key === 'Enter' && event.target.type === 'search') event.preventDefault();
  });
  updateSelection();
});
</script>
