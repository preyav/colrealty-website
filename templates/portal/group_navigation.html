<details class="accounting-popout portal-group" id="{{ group }}-popout"><summary class="nav-item{% if active %} active{% endif %}" aria-controls="{{ group }}-popup" aria-expanded="false"><span class="nav-icon">{{ icon }}</span>{{ title }}<span aria-hidden="true" style="margin-left:auto">›</span></summary><nav class="accounting-sidebar" id="{{ group }}-popup" aria-label="{{ title }}">{% for item in items %}<a href="{{ item.url }}" class="nav-subitem{% if item.key == active %} active{% endif %}"{% if item.key == active %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav></details>
