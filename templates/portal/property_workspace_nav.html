{% load portal_navigation %}{% property_financial_labels as property_nav %}
<nav class="property-workspace-nav" aria-label="{{ property_nav.overview }}"><a href="{% url 'portal:property_detail' property.pk %}"{% if not property_financial_active %} aria-current="page"{% endif %}>{{ property_nav.overview }}</a><a href="{% url 'portal:property_financials' property.pk %}"{% if property_financial_active %} aria-current="page"{% endif %}>{{ property_nav.financials }}</a></nav>
<style>.property-workspace-nav{display:flex;gap:28px;border-bottom:1px solid #e2e8f0;margin:0 0 22px}.property-workspace-nav>a{padding:14px 0;color:#64748b;text-decoration:none;font-size:.9rem;border-bottom:2px solid transparent}.property-workspace-nav>a[aria-current=page]{color:#087c96;border-bottom-color:#01AACE}.property-workspace-nav>a:focus-visible{outline:2px solid #01AACE;outline-offset:3px}</style>
