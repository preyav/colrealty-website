<script>
document.addEventListener('DOMContentLoaded',()=>{
 const menus=[...document.querySelectorAll('details.accounting-popout')];
 menus.forEach(menu=>{
  const button=menu.querySelector('summary'),popup=menu.querySelector('nav');
  button.addEventListener('click',()=>menus.forEach(other=>{if(other!==menu)other.open=false;}));
  if(!menu.classList.contains('portal-group'))return;
  function place(){popup.removeAttribute('data-positioned');const rect=button.getBoundingClientRect();popup.style.left=Math.max(12,Math.min(rect.right+8,innerWidth-popup.offsetWidth-12))+'px';popup.style.top=Math.max(12,Math.min(rect.top,innerHeight-popup.offsetHeight-12))+'px';popup.setAttribute('data-positioned','');}
  menu.addEventListener('toggle',()=>{button.setAttribute('aria-expanded',String(menu.open));if(menu.open)place();else popup.removeAttribute('data-positioned');});
  document.addEventListener('click',event=>{if(!menu.contains(event.target))menu.open=false;});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menu.open){menu.open=false;button.focus();}});
  popup.addEventListener('keydown',event=>{const links=[...popup.querySelectorAll('a')],index=links.indexOf(document.activeElement);if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();links[(index+(event.key==='ArrowDown'?1:-1)+links.length)%links.length]?.focus();}});
  window.addEventListener('resize',()=>{if(menu.open)place();});
  document.addEventListener('scroll',event=>{if(menu.open&&!menu.contains(event.target))menu.open=false;},true);
 });
});
</script>
