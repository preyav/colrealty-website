<style>
.accounting-page input,.accounting-page select,.accounting-page textarea,.accounting-page button{font-family:inherit}.accounting-page button.btn{font-size:.8rem}

.accounting-page{font-family:inherit;width:100%;max-width:1320px;margin:10px auto 30px;min-width:0;color:#25364a}.accounting-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 30px}.accounting-heading>div{display:flex;align-items:center;gap:14px}.accounting-heading h1{font-size:1.65rem;font-weight:500;margin:0}.accounting-page .btn-primary{background:#01AACE;color:white}.accounting-page a{color:#087c96}.accounting-page a.btn-primary{color:#fff}.accounting-table{border:1px solid #e2e8f0;border-radius:8px;background:white;overflow-x:auto}.accounting-table table{border-collapse:collapse;width:100%;font-size:.85rem}.accounting-table th,.accounting-table td{padding:14px 16px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.accounting-table th{background:#f5f6f8;color:#475569;font-size:.72rem;text-transform:uppercase}.accounting-table td:nth-last-child(3){max-width:360px}.accounting-filters{padding:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.accounting-filters select,.accounting-filters input:not([type=checkbox]){padding:11px 13px;border:1px solid #d7dee5;border-radius:6px;background:#fff;font:inherit;font-size:.85rem}.accounting-type-filter{position:relative;min-width:180px;font-size:.85rem}.accounting-type-filter>summary{cursor:pointer;list-style:none;padding:11px 13px;border:1px solid #d7dee5;border-radius:6px}.accounting-type-filter>div{position:fixed;z-index:40;top:45px;left:0;min-width:240px;padding:14px;background:white;border:1px solid #d7dee5;border-radius:6px;box-shadow:0 8px 22px #0002}.accounting-type-filter label{display:block;padding:8px 0}.accounting-code-toggle{margin-left:auto;font-size:.8rem;white-space:nowrap}.accounting-results{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:.8rem;color:#64748b;padding-top:10px}.accounting-info{position:relative;display:inline-block}.accounting-info summary{list-style:none;cursor:pointer;background:#01AACE;color:white;border-radius:50%;width:19px;height:19px;text-align:center;font-family:inherit;font-size:13px;font-weight:700;line-height:19px}.accounting-info p{position:absolute;left:0;top:24px;z-index:60;width:min(360px,75vw);padding:16px;background:white;border:1px solid #01AACE;border-radius:8px;box-shadow:0 8px 22px #0002;font-size:.83rem;font-weight:400;line-height:1.5}.accounting-form-page{max-width:1050px}.accounting-form-page .accounting-heading{margin-top:24px}.accounting-form-card{padding:26px;border:1px solid #e2e8f0;border-radius:8px;background:white}.accounting-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 26px}.accounting-fields .wide{grid-column:1/-1}.accounting-label{display:flex;gap:7px;align-items:center;margin-bottom:8px;font-size:.9rem;font-weight:600}.accounting-label span{color:#b57f50}.accounting-fields input:not([type=checkbox]):not([type=radio]),.accounting-fields textarea,.accounting-fields select{box-sizing:border-box;width:100%;min-height:43px;border:1px solid #cbd5e1;border-radius:6px;padding:10px 12px;font:inherit}.accounting-fields textarea{min-height:110px}.accounting-fields [required]{background:#F4E8DC;border-color:#C69A6B}.accounting-page input[type=checkbox],.accounting-page input[type=radio]{width:17px;height:17px;accent-color:#01AACE;vertical-align:middle}.accounting-buttons{display:flex;gap:10px;border-top:1px solid #e2e8f0;padding-top:22px;margin-top:24px}.accounting-page .errorlist{font-size:.83rem;color:#b91c1c}.accounting-page [hidden]{display:none!important}.accounting-page :focus-visible{outline:2px solid #01AACE;outline-offset:3px}@media(max-width:700px){.accounting-heading{align-items:flex-start;flex-wrap:wrap}.accounting-fields{grid-template-columns:1fr}.accounting-code-toggle{margin-left:0}.accounting-form-card{padding:20px}}
.accounting-page [name="account_level"]{margin-right:8px}.accounting-fields [id$="account_level"]>div{margin:9px 0}.accounting-fields input[type=checkbox],.accounting-fields input[type=radio]{background:white;min-height:0}.accounting-form-card [hidden]{display:none!important}
.accounting-parent{display:block;font-size:.75rem;color:#64748b;margin-top:5px}
.accounting-fields input[type=checkbox]:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(1)}
.accounting-table th a[data-account-sort]{display:flex;align-items:center;justify-content:space-between;gap:12px;color:inherit;text-decoration:none;white-space:nowrap}.accounting-table th a[data-account-sort]:hover{color:#087c96}.accounting-table th a[data-account-sort] span{color:#64748b;font-size:.9rem}.accounting-filters input[type=hidden]{display:none}
.chart-row-actions>summary{list-style:none;border:1px solid #b8c6d1;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#087c96;font-size:12px;letter-spacing:1px}.chart-row-actions>summary::-webkit-details-marker{display:none}.chart-row-actions>div{position:fixed;z-index:1000;width:min(260px,calc(100vw - 24px));background:white;border:1px solid #d7dee5;border-radius:7px;box-shadow:0 8px 24px #0002;padding:8px 0}.chart-row-actions>div>a,.chart-row-actions>div>span{display:block;padding:11px 16px;font-size:.85rem;white-space:normal;text-decoration:none}.chart-row-actions>div>a:hover{background:#eff8fb}.chart-row-actions>div>span{color:#94a3b8;cursor:not-allowed}.chart-row-actions small{font-size:.7rem;line-height:1.4}.chart-row-actions .chart-delete{color:#b91c1c}
</style>
<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.accounting-type-filter').forEach(item=>item.addEventListener('toggle',()=>{if(!item.open)return;const rect=item.querySelector('summary').getBoundingClientRect();const popup=item.querySelector('div');popup.style.top=(rect.bottom+6)+'px';popup.style.left=Math.max(8,Math.min(rect.left,innerWidth-260))+'px';popup.style.maxHeight=Math.max(100,innerHeight-rect.bottom-20)+'px';popup.style.overflowY='auto';}));});window.addEventListener('resize',()=>document.querySelectorAll('.accounting-type-filter[open]').forEach(item=>item.open=false));document.addEventListener('click',event=>{document.querySelectorAll('.accounting-info[open],.accounting-type-filter[open]').forEach(item=>{if(!item.contains(event.target))item.open=false;});});document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.accounting-info[open],.accounting-type-filter[open]').forEach(item=>item.open=false);});</script>

<script>document.addEventListener('DOMContentLoaded',()=>{const menus=[...document.querySelectorAll('.chart-row-actions')];menus.forEach(menu=>menu.addEventListener('toggle',()=>{if(!menu.open)return;menus.forEach(other=>{if(other!==menu)other.open=false;});const button=menu.querySelector('summary'),popup=menu.querySelector('div'),rect=button.getBoundingClientRect();popup.style.left=Math.max(12,Math.min(rect.right-popup.offsetWidth,innerWidth-popup.offsetWidth-12))+'px';popup.style.top=Math.max(12,Math.min(rect.bottom+6,innerHeight-popup.offsetHeight-12))+'px';}));document.addEventListener('click',event=>menus.forEach(menu=>{if(!menu.contains(event.target))menu.open=false;}));document.addEventListener('keydown',event=>{if(event.key==='Escape')menus.forEach(menu=>{if(menu.open){menu.open=false;menu.querySelector('summary').focus();}});});window.addEventListener('resize',()=>menus.forEach(menu=>menu.open=false));document.addEventListener('scroll',event=>menus.forEach(menu=>{if(!menu.contains(event.target))menu.open=false;}),true);});</script>
