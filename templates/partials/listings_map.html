<div id="{{ map_id|default:'map' }}" class="listing-map"></div>

{{ markers|json_script:"markers-data" }}

{# Load Google Maps JS only once #}
{# Update this line in your partial #}
<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&v=weekly"></script>

<script>
  window.addEventListener("load", () => {
    const markers = JSON.parse(document.getElementById("markers-data").textContent || "[]");

    const fallback = { lat: 30.2672, lng: -97.7431 }; // Austin
    const mapEl = document.getElementById("{{ map_id|default:'map' }}");

    if (!mapEl) return;

    const map = new google.maps.Map(mapEl, {
      center: fallback,
      zoom: 11,
	  mapId: "DEMO_MAP_ID", 
    });

    const info = new google.maps.InfoWindow();
    const bounds = new google.maps.LatLngBounds();
    let hasAny = false;

	markers.forEach(m => {
	  // 1. Handle flexible key names (lat vs latitude)
	  const latVal = m.lat || m.latitude;
	  const lngVal = m.lng || m.longitude;

	  // 2. Force conversion to numbers
	  const lat = parseFloat(latVal);
	  const lng = parseFloat(lngVal);

	  // 3. Skip if data is bad
	  if (isNaN(lat) || isNaN(lng) || lat === 0) return;

	  hasAny = true;
	  const pos = { lat: lat, lng: lng };
	  bounds.extend(pos);

	  const marker = new google.maps.Marker({
		map: map,
		position: pos,
		title: m.title || "Col Realty Listing",
	  });

	  // 4. InfoWindow Listener
	  marker.addListener("click", () => {
		const priceText = m.price ? `<b>$${m.price}</b>` : '';
		info.setContent(`
		  <div style="padding:10px; max-width:200px;">
			<div style="font-weight:bold;">${m.title || 'Property'}</div>
			<div>${priceText}</div>
			<a href="${m.url || '#'}" style="display:block; margin-top:8px;">View Details</a>
		  </div>
		`);
		info.open(map, marker);
	  });
	});

    if (hasAny) {
      map.fitBounds(bounds);
      // Prevent over-zoom when only one marker exists
      google.maps.event.addListenerOnce(map, "bounds_changed", () => {
        if (map.getZoom() > 16) map.setZoom(16);
      });
    }
  });
</script>

<style>
  .listing-map {
    height: 520px;
    width: 100%;
    border-radius: 16px;
    margin: 18px 0;
  }
</style>
