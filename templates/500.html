{% extends "portal/base.html" %}
{% block title %}{{ error_code }} · {{ error_title }} · COL360{% endblock %}
{% block page_title %}COL360{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="card" style="width:100%;max-width:560px;margin:0;text-align:center;">
    <div style="padding:48px 36px;">
      <div style="font-size:0.78rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#94a3b8;margin-bottom:12px;">Error {{ error_code }}</div>
      <h2 style="font-size:1.55rem;color:#0f172a;margin-bottom:12px;">{{ error_title }}</h2>
      <p style="font-size:0.95rem;line-height:1.65;color:#64748b;max-width:430px;margin:0 auto 26px;">{{ error_message }}</p>
      <a href="{% url 'portal:dashboard' %}" class="btn btn-primary" style="padding:9px 18px;">Back to COL360</a>
    </div>
  </div>
</div>
{% endblock %}
