{% extends 'base.html' %}
{% block content %}
<section class="py-5 bg-light" style="min-height: 25vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Team Portal Access</h2>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-weight-bold">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Login to Dashboard</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
