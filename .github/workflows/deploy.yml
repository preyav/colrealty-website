# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# Col Realty — CI/CD Pipeline
#
# Triggers on every push to `main` branch.
#
# Pipeline steps:
#   1. Run Django tests
#   2. Deploy to EC2 via AWS SSM (no SSH key needed)
#   3. Install dependencies, migrate, collectstatic
#   4. Restart Gunicorn + Celery
#   5. Health check to confirm site is up
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID            → IAM access key
#   AWS_SECRET_ACCESS_KEY        → IAM secret key
#   EC2_INSTANCE_ID              → i-0xxxxxxxxxxxxxxxxx
#   DJANGO_SECRET_KEY            → production secret key
#   DATABASE_URL                 → postgres://... RDS connection string
#   DJANGO_ALLOWED_HOSTS         → colrealty.com,www.colrealty.com,54.82.48.58
#   DJANGO_CSRF_TRUSTED_ORIGINS  → https://colrealty.com,https://www.colrealty.com
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Job 1: Run tests ───────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       colrealty_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG:      "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      DATABASE_URL:      "postgres://postgres:postgres@localhost:5432/colrealty_test"
      CELERY_BROKER_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --verbosity=2

  # ── Job 2: Deploy to EC2 via AWS SSM ──────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Deploy via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo === Col Realty Deployment Started $(date) ===",
              "cd /home/ec2-user/colrealty",
              "git pull origin main",
              "source venv/bin/activate",
              "pip install -r requirements.txt --quiet",
              "python manage.py migrate --no-input",
              "python manage.py collectstatic --no-input --clear",
              "sudo systemctl restart gunicorn",
              "sudo systemctl restart celery",
              "echo === Deployment Complete ==="
            ]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to complete
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Show deployment output
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Check deployment status
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed: $STATUS"
            exit 1
          fi

      - name: Health check
        run: |
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://www.colrealty.com/health/)
          echo "Health check: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Site is up!"
          else
            echo "❌ Health check failed: $HTTP_STATUS"
            exit 1
          fi
