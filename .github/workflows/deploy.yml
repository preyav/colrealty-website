# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────────────────
# Col Realty — CI/CD Pipeline
#
# Triggers on every push to `main` branch.
#
# Pipeline steps:
#   1. Run Django tests
#   2. SSH into EC2 and deploy latest code
#   3. Install dependencies, migrate, collectstatic
#   4. Restart Gunicorn + Celery
#   5. Health check to confirm site is up
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST        → your EC2 public IP or domain e.g. 54.82.48.58
#   EC2_USER        → ec2-user
#   EC2_SSH_KEY     → contents of your .pem private key file
#   DJANGO_SECRET_KEY            → production secret key
#   DATABASE_URL                 → postgres://... RDS connection string
#   DJANGO_ALLOWED_HOSTS         → colrealty.com,www.colrealty.com,54.82.48.58
#   DJANGO_CSRF_TRUSTED_ORIGINS  → https://colrealty.com,https://www.colrealty.com
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # allows manual trigger from GitHub Actions UI

jobs:

  # ── Job 1: Run tests ───────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       colrealty_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG:      "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      DATABASE_URL:      "postgres://postgres:postgres@localhost:5432/colrealty_test"
      CELERY_BROKER_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --verbosity=2

  # ── Job 2: Deploy to EC2 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test           # only deploy if tests pass
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          timeout:     120s
          script: |
            set -e    # exit immediately if any command fails

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Col Realty — Deployment started"
            echo "  $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /home/ec2-user/colrealty

            # ── 1. Pull latest code ──────────────────
            echo "▶ Pulling latest code from main..."
            git pull origin main

            # ── 2. Activate virtualenv ───────────────
            source venv/bin/activate

            # ── 3. Install/update dependencies ──────
            echo "▶ Installing dependencies..."
            pip install -r requirements.txt --quiet

            # ── 4. Run database migrations ───────────
            echo "▶ Running migrations..."
            python manage.py migrate --no-input

            # ── 5. Collect static files to S3/local ──
            echo "▶ Collecting static files..."
            python manage.py collectstatic --no-input --clear

            # ── 6. Restart Gunicorn ───────────────────
            echo "▶ Restarting Gunicorn..."
            sudo systemctl restart gunicorn
            sudo systemctl is-active --quiet gunicorn && echo "  Gunicorn ✅" || echo "  Gunicorn ❌ FAILED"

            # ── 7. Restart Celery ─────────────────────
            echo "▶ Restarting Celery worker..."
            sudo systemctl restart celery
            sudo systemctl is-active --quiet celery && echo "  Celery ✅" || echo "  Celery ❌ FAILED"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Deployment complete ✅"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Health check — confirm site is responding ──────────────────────
      - name: Health check
        run: |
          echo "Running health check..."
          sleep 5    # give Gunicorn a moment to fully restart

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://${{ secrets.EC2_HOST }}/health/)

          echo "Health check response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Site is up and healthy"
          else
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi
